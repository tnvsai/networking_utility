<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="google-adsense-account" content="ca-pub-8835983411485108">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QT3X9W3H8H"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-QT3X9W3H8H');
    </script>

    <title>Networking Utility Tool</title>
    <link rel="icon" type="image/png" href="icon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="floral-theme.css">
    <link rel="stylesheet" href="theme-elements.css">

    <script>
        // Allow the native context menu inside editable fields (so right-click
        // Copy/Paste works in the input/output boxes and notes); block elsewhere.
        document.addEventListener("contextmenu", function (e) {
            var el = e.target;
            var tag = el.tagName;
            if (tag === 'TEXTAREA' || tag === 'INPUT' || el.isContentEditable) {
                return;
            }
            e.preventDefault();
        }, false);

        document.addEventListener("keydown", function (e) {
            if (e.ctrlKey && (e.key === 'u' || e.key === 'i')) {
                e.preventDefault();
            }
        }, false);
    </script>

    <script type="text/javascript" src="/eel.js"></script>
    <script src="filter.js"></script>


</head>

<body data-theme="dark">
    <!-- Decorative background layer (scanlines, mesh gradient, grid, etc.) -->
    <div class="theme-bg" aria-hidden="true"></div>

    <div id="banner">Copied</div>

    <!-- Auto-Ping Progress Modal -->
    <div id="pingProgress" role="dialog" aria-modal="true" aria-labelledby="pingProgressTitle" aria-hidden="true">
        <h3 id="pingProgressTitle">Auto-Ping in Progress...</h3>
        <div id="pingStatus" role="status" aria-live="polite">Preparing to ping...</div>
        <div id="pingDetails"></div>
        <div style="margin-top:20px;">
            <div class="progress-track">
                <div id="pingProgressBar"></div>
            </div>
            <div id="pingPercentage">0%</div>
        </div>
        <button type="button" id="stopPingBtn" class="ping-stop-btn" onclick="stopAutoPing()" disabled
            aria-label="Stop auto-ping">
            <i class="fas fa-stop"></i> Stop Ping
        </button>
    </div>

    <div class="main-wrapper">
        <!-- App Header / Branding Bar -->
        <header class="app-header">
            <div class="app-title"><i class="fas fa-moon" id="appTitleIcon"></i> Networking Utility</div>
            <div class="app-tagline">IP extraction &bull; bulk ping &bull; interface &amp; incident triage</div>
        </header>

        <!-- Quick Notes Modal -->
        <div id="notesModal" class="notes-modal" style="display:none;">
            <div class="notes-modal-header">
                <b class="notes-modal-title"><i class="fas fa-pen"></i> Quick Notes</b>
                <div class="notes-color-dots">
                    <button type="button" class="notes-color-dot" onclick="setNoteColor('#fff9c4', '#f0e68c')"
                        style="--dot-bg:#fff9c4; --dot-border:#e6db74;" title="Yellow"></button>
                    <button type="button" class="notes-color-dot" onclick="setNoteColor('#ffcdd2', '#ef9a9a')"
                        style="--dot-bg:#ffcdd2; --dot-border:#ef5350;" title="Red (Critical)"></button>
                    <button type="button" class="notes-color-dot" onclick="setNoteColor('#bbdefb', '#90caf9')"
                        style="--dot-bg:#bbdefb; --dot-border:#42a5f5;" title="Blue (Info)"></button>
                    <button type="button" class="notes-color-dot" onclick="setNoteColor('#ffffff', '#e0e0e0')"
                        style="--dot-bg:#ffffff; --dot-border:#bdbdbd;" title="White"></button>
                    <button type="button" class="notes-color-dot" onclick="setNoteColor('#333333', '#1a1a1a')"
                        style="--dot-bg:#333333; --dot-border:#000000;" title="Black"></button>
                    <button type="button" class="notes-icon-btn" onclick="resetNotesTheme()" title="Match current theme">
                        <i class="fas fa-palette"></i></button>
                    <button type="button" class="notes-icon-btn" onclick="clearNotes()" title="Clear All">
                        <i class="fas fa-trash-alt"></i></button>
                    <button type="button" class="notes-icon-btn notes-close-btn" onclick="toggleNotes()" title="Close">&times;</button>
                </div>
            </div>
            <div id="quickNotesArea" class="notes-modal-body" contenteditable="true"></div>
            <div id="saveStatus" class="notes-modal-footer">Saved</div>
        </div>

        <!-- Collapsible Commands & Templates toolbar -->
        <div class="toolbar-section collapsed" id="toolbarSection">
            <button type="button" class="toolbar-toggle" id="toolbarToggle" aria-expanded="false"
                aria-controls="toolbarPanel" onclick="toggleToolbar()">
                <i class="fas fa-chevron-down toolbar-chevron" aria-hidden="true"></i>
                <span>Commands &amp; Templates</span>
                <span class="toolbar-hint">click to expand</span>
            </button>
            <div class="toolbar-panel" id="toolbarPanel">
                <div class="toolbar-group">
                    <span class="toolbar-group-label">Commands</span>
                    <button class="cool-button cool-button--compact" type="button" id="NodeUpCmd" onclick="copyNodeUpCmd(event)">
                        Device
                        <span class="hovertext">Click to copy for node up</span>
                    </button>
                    <button class="cool-button cool-button--compact" type="button" id="hardwareUpCmd" onclick="copyNodeUpCmd(event)">
                        Hardware
                        <span class="hovertext">Click to copy for hardware related</span>
                    </button>
                </div>
                <div class="toolbar-group toolbar-group--wide">
                    <span class="toolbar-group-label">Templates</span>
                    <button class="cool-button cool-button--compact" type="button" id="Node_Resolution_template"
                        onclick="copyNodeUpCmd(event)">
                        Node
                        <span class="hovertext">Click to copy for Node_Resolution_template</span>
                    </button>
                    <button class="cool-button cool-button--compact" type="button" id="Hardware_Resolution_template"
                        onclick="copyNodeUpCmd(event)">
                        Hardware
                        <span class="hovertext">Click to copy for Hardware_Resolution_template</span>
                    </button>
                    <button class="cool-button cool-button--compact" type="button" id="Interface_Resolution_template"
                        onclick="copyNodeUpCmd(event)">
                        Interface
                        <span class="hovertext">Click to copy for Interface_Resolution_template</span>
                    </button>
                    <button class="cool-button cool-button--compact" type="button" id="CPU_Load_Resolution_template"
                        onclick="copyNodeUpCmd(event)">
                        CPU Load
                        <span class="hovertext">Click to copy for High CPU utilization template</span>
                    </button>
                    <button class="cool-button cool-button--compact" type="button" id="Village_Resolution_template"
                        onclick="copyNodeUpCmd(event)">
                        Village
                        <span class="hovertext">Click to copy for Village_Resolution_template</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Theme Toggle Switch & Notes (Row Layout - Top Right Absolute) -->
        <div class="theme-switch-wrapper">
            <button onclick="toggleNotes()" class="icon-button quick-notes-btn" title="Quick Notes">
                <i class="fas fa-edit"></i>
                <span>Quick Notes</span>
            </button>

            <!-- Theme Selector -->
            <div class="theme-select" role="group" aria-label="Theme">
                <button type="button" class="theme-opt" data-theme="dark" onclick="setTheme('dark')"
                    title="Night" aria-label="Night dark theme"><i class="fas fa-moon"></i></button>
                <button type="button" class="theme-opt" data-theme="light" onclick="setTheme('light')"
                    title="Light" aria-label="Light theme"><i class="fas fa-sun"></i></button>
                <button type="button" class="theme-opt" data-theme="floral" onclick="setTheme('floral')"
                    title="JC" aria-label="JC theme"><i class="fas fa-seedling"></i></button>
            </div>
            <span class="theme-current-label" id="themeCurrentLabel" aria-live="polite"></span>
        </div>

        <form id="mainForm" style="background-color: transparent;" aria-busy="false">

            <div class="textarea-container">
                <div class="div-50">

                    <label for="description">
                        <div class="label-container">
                            <div class="label-title-row">
                                <b>Input</b>
                                <span id="ipCountBadge" class="ip-count-badge ip-count-badge--empty" role="status"
                                    aria-live="polite">0 IPs detected</span>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <div id="tooltip">i
                                    <span class="tooltiptext">
                                        Paste incident text containing IP addresses. Use buttons to extract IPs or
                                        analyze ping
                                        results.
                                    </span>
                                </div>
                                <button class="action-btn clear-btn" type="button"
                                    onclick="clearText('description')"><i class="fas fa-trash-alt"></i> Clear</button>
                                <button class="action-btn paste-btn" type="button" onclick="pasteText('description')"><i class="fas fa-paste"></i> Paste</button>
                                <button class="action-btn copy-btn" type="button" onclick="copyText('description')"><i class="fas fa-copy"></i> Copy</button>
                            </div>
                        </div>
                    </label>
                    <textarea id="description" name="description" rows="13"
                        placeholder="Paste your text here..."></textarea>

                </div>
                <div class="div-50">
                    <label for="result">
                        <div class="label-container">
                            <b>Output</b>
                            <div>
                                <button class="action-btn clear-btn" type="button" onclick="clearText('result')"><i class="fas fa-trash-alt"></i> Clear</button>
                                <button class="action-btn copy-btn" type="button" onclick="copyText('result')"><i class="fas fa-copy"></i> Copy</button>
                            </div>
                        </div>
                    </label>
                    <textarea id="result" name="result" rows="13" readonly
                        placeholder="Results will appear here..."></textarea>

                    <!-- Color-coded Ping Result Summary (populated by ping analysis / auto-ping) -->
                    <div id="resultPanel" class="result-panel" style="display:none;"></div>
                </div>

            </div>
            <div class="button-container">
                <button type="button" onclick="print_all_IPs()"><i class="fas fa-terminal"></i> Generate Ping
                    Commands</button>
                <button id="autoPingBtn" type="button" onclick="autoPingIPs()"
                    aria-label="Auto-ping all IPs in input"><i class="fas fa-satellite-dish"></i>
                    Auto-Ping All IPs</button>
                <button type="button" onclick="filter_node_Up_Down()"><i class="fas fa-chart-line"></i> Analyze Ping
                    Results</button>
                <button type="button" onclick="print_all_Interfaces()"><i class="fas fa-search"></i> Analyse
                    Interface</button>
            </div>
        </form>

        <div class="version-footer">
            <a href="https://github.com/tnvsai/networking_utility" target="_blank" title="Download latest version">
                <i class="fab fa-github"></i> GitHub
            </a>
            v2.1.0
            <br>
            <span style="font-size: 11px; opacity: 0.7;">Feel free to update code according to project need</span>
        </div>
    </div>

</body>

</html>
